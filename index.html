<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Mind Reading Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="qualtrics-frame">
    <header class="survey-header" aria-label="University of Pennsylvania">
      <img src="penn-logo.png" class="penn-logo" alt="University of Pennsylvania">
    </header>

    <div class="progress-wrap" aria-hidden="true">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <main id="surveyContent" class="survey-content" aria-live="polite"></main>

    <footer class="survey-footer" aria-hidden="true">
      <span></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
