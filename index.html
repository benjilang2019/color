<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#011f5b">
  <title>Mind Reading Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="survey-shell">
    <header class="brand-bar" aria-label="Study header">
      <div class="brand-logo-window"><img class="brand-logo" src="penn-logo.png" alt="University of Pennsylvania"></div>
    </header>

    <div class="progress-track" aria-hidden="true">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <main id="surveyPage" class="survey-page" aria-live="polite"></main>

    <footer class="survey-footer">
      <span>Mind Reading Game</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
